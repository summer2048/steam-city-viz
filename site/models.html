<!doctype html><meta charset="utf-8"><title>component sheet</title>
<body style="margin:0;background:#e9dcc0;font:12px sans-serif">
<h2 style="margin:16px 20px 0">Painted sprites (what the map draws) · 手绘素材（地图实际使用）</h2>
<div id="art" style="display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px"></div>
<h2 style="margin:16px 20px 0">Code-drawn models (fallback and reference geometry) · 代码绘制的模型（后备）</h2>
<canvas id="c" width="2400" height="2100"></canvas>
<script type="module">
const meta = await fetch('sprites/sprites.json').then((r) => r.json()).catch(() => ({}));
document.getElementById('art').innerHTML = Object.keys(meta).map((id) => `<figure style="margin:0"><img src="sprites/${id}.webp" loading="lazy" style="height:220px;display:block"><figcaption>${id}</figcaption></figure>`).join('') || 'no sprites built yet: run scripts/artkit_sprites.py';
</script>
<script type="module">
import { LANDMARKS, generic, renderSprite, treeSprite, ANG, SS } from './js/models.js';
const g = document.getElementById('c').getContext('2d'); g.fillStyle = '#e9dcc0'; g.fillRect(0, 0, 2400, 2100);
let x = 20, y = 20, rowH = 0; const put = (sp, label, k = 1) => { const w = sp.w * k, h = sp.h * k; if (x + w > 2380) { x = 20; y += rowH + 22; rowH = 0; } g.drawImage(sp.cv, x, y, w, h); g.fillStyle = '#171a2e'; g.fillText(label, x, y + h + 11); x += w + 14; rowH = Math.max(rowH, h); };
for (const [name, fn] of Object.entries(LANDMARKS)) for (const a of [0, 2, 5, 11]) put(renderSprite(fn(), (a / ANG) * 6.2832, { seed: 3 }), a === 0 ? name : '', 1);
x = 20; y += rowH + 30; rowH = 0;
for (const fam of ['glass', 'bank', 'condo', 'brick', 'loft', 'shop', 'house', 'cottage', 'shed', 'silo', 'pavilion', 'gothic', 'bungalow']) for (const [fl, v] of [[2, 0], [3, 1], [5, 2], [8, 1], [12, 0], [16, 2]]) { if ((['house', 'cottage', 'bungalow', 'shed'].includes(fam) && fl > 3) || (['shop', 'pavilion', 'gothic', 'loft', 'silo'].includes(fam) && fl > 8)) continue; put(renderSprite(generic(fam, fl, v), ((v * 3) / ANG) * 6.2832, { seed: fl * 7 + v, lit: 0.6 }), fam + ' ' + fl, 1); }
for (let k = 0; k < 6; k++) put(treeSprite(k % 3, k), 'tree');
document.body.classList.add('ready');
</script>
